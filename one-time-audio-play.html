<body>
  <div id="player">
    <div class="album">
      <div class="info">
        <div class="equalizer">
          <span class="bar bar1"></span>
          <span class="bar bar2"></span>
          <span class="bar bar3"></span>
          <span class="bar bar4"></span>
        </div>
        <div class="progress-bar">
          <div class="time--current">0:00</div>
          <div class="time--total">-0:00</div>
          <div class="fill"></div>
        </div>
        <div class="currently-playing">
          <h2 class="song-name"></h2>
          <h3 class="artist-name"></h3>
        </div>
        <div class="controls-wrapper">
          <div class="controls">
            <div class="option">
              <abbr title="Options"><i class="fas fa-bars"></i></abbr>
            </div>
            <div class="volume">
              <abbr title="Volume">
                <i class="fas fa-volume-up"></i>
              </abbr>
              <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume control slider">
            </div>
            <div class="play">
              <abbr title="Play"><i class="fas fa-play"></i></abbr>
            </div>
            <div class="pause">
              <abbr title="Pause"><i class="fas fa-pause"></i></abbr>
            </div>
          </div>
        </div>

      </div>

    </div>
    
    <script type="module" src="https://masumbillah6778.github.io/js/one-time-audio-play.js"></script>
</body>
