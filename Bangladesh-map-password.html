<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Map Password Protected Links</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #4285F4;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .map-container {
            position: relative;
            display: inline-block;
            max-width: 450px;
            border: 3px solid #333;
            border-radius: 12px;
            background: #000;
        }
        .map-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }
        /* বিভাগের ওপর ক্লিকযোগ্য বাটন */
        .division-btn {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px dashed transparent;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .division-btn:focus, .division-btn:hover {
            border-color: #4285F4;
            background-color: rgba(66, 133, 244, 0.4);
            transform: scale(1.05);
        }

        /* বিভাগগুলোর পজিশন */
        .rangpur { top: 9%; left: 22%; width: 25%; height: 16%; }
        .rajshahi { top: 26%; left: 14%; width: 26%; height: 23%; }
        .mymensingh { top: 21%; left: 43%; width: 23%; height: 18%; }
        .sylhet { top: 19%; left: 68%; width: 25%; height: 23%; }
        .dhaka { top: 40%; left: 41%; width: 22%; height: 23%; }
        .khulna { top: 47%; left: 19%; width: 25%; height: 26%; }
        .barishal { top: 65%; left: 41%; width: 17%; height: 18%; }
        .chittagong { top: 41%; left: 66%; width: 29%; height: 50%; }
    </style>
</head>
<body>

    <h2>বাংলাদেশের ম্যাপ: বিভাগভিত্তিক গোপন লিংক</h2>
    <p>যেকোনো বিভাগে ক্লিক করে আলাদা পাসওয়ার্ড দিন</p>

    <div class="map-container">
        <!-- ম্যাপের ছবির লিংক এখানে বসাবেন -->
        <img src="bm.png" alt="Bangladesh Map" class="map-image">

        <!-- ১. রংপুর (লিংক ও পাসওয়ার্ড পরিবর্তন করে নিন) -->
        <button class="division-btn rangpur" onclick="checkPassword('https://www.youtube.com', '1111')" title="রংপুর"></button>

        <!-- ২. রাজশাহী -->
        <button class="division-btn rajshahi" onclick="checkPassword('https://www.google.com', '2222')" title="রাজশাহী"></button>

        <!-- ৩. ময়মনসিংহ -->
        <button class="division-btn mymensingh" onclick="checkPassword('https://example.com', '3333')" title="ময়মনসিংহ"></button>

        <!-- ৪. সিলেট -->
        <button class="division-btn sylhet" onclick="checkPassword('https://example.com', '4444')" title="সিলেট"></button>

        <!-- ৫. ঢাকা -->
        <button class="division-btn dhaka" onclick="checkPassword('https://example.com', '5555')" title="ঢাকা"></button>

        <!-- ৬. খুলনা -->
        <button class="division-btn khulna" onclick="checkPassword('https://example.com', '6666')" title="খুলনা"></button>

        <!-- ৭. বরিশাল -->
        <button class="division-btn barishal" onclick="checkPassword('https://example.com', '7777')" title="বরিশাল"></button>

        <!-- ৮. চট্টগ্রাম -->
        <button class="division-btn chittagong" onclick="checkPassword('https://example.com', '8888')" title="চট্টগ্রাম"></button>
    </div>

    <script>
        function checkPassword(targetUrl, correctPassword) {
            let userPassword = prompt("এই বিভাগের জন্য পাসওয়ার্ড দিন:");
            
            if (userPassword === correctPassword) {
                window.open(targetUrl, '_blank');
            } else if (userPassword !== null) {
                alert("ভুল পাসওয়ার্ড!");
            }
        }
    </script>

</body>
</html>
