<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web Protected File html">
    <meta name="title" content="Protected-file">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="icon" type="image/x-icon" href="https://masumbillah6778.github.io/images/music-logo1.png">
    <title> Audio Player </title>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/music-album-v1.css">
</head>

<body>

    <div class="content">
        <h1> Audio Player </h1>
        <div class="mhn-player">
            <div class="album-art"></div>
            <div class="play-list">
  
                <a href="#" class="play"
                    data-id="1"
                    data-title="১. মাহে রমজান এলো বছর ঘুরে"
                    data-artist="আকাশ মাহমুদ"
                    data-album="পবিত্র মাহে রমজান"
                    data-albumart="https://masumbillah6778.github.io/images/mahe-ramadan-1.jpg"
                    data-url="https://github.com/masumbillah6778/Islamicsong/raw/main/mahe_romjan%20_alo_bosor_ghure.mp3">
                </a>

                <a href="#" class="play"
                    data-id="32"
                    data-album="পবিত্র মাহে রমজান"
                    data-artist="পবিত্র মাহে রমজান"
                    data-title="৩২. নবীর রওজা শরীফ"
                    data-albumart="https://masumbillah6778.github.io/images/mahe-ramadan-1.jpg"
                    data-url="https://github.com/masumbillah6778/Islamicsong/raw/main/nobir-rouja-sorif.mp3">
                </a>
            </div>
            <div class="audio"></div>
            <div class="current-info">
                <div class="song-title"></div>
                <div class="song-artist"></div>
                <div class="song-album"></div>
            </div>

            <div class="controls">
                <a href="#" class="toggle-play-list"><i class="fa fa-list-ul"></i></a>
                <div class="duration clearfix">
                    <span class="pull-left play-position"></span>
                    <span class="pull-right"><span class="play-current-time">00:00</span> / <span class="play-total-time">00:00</span></span>
                </div>

                <div class="progress"><div class="bar"></div></div>
                <div class="action-button">
                    <a href="#" class="prev"><i class="fa fa-step-backward"></i></a>
                    <a href="#" class="play-pause"><i class="fa fa-pp"></i></a>
                    <a href="#" class="stop"><i class="fa fa-stop"></i></a>
                    <a href="#" class="next"><i class="fa fa-step-forward"></i></a>
                    <input type="range" class="volume" min="0" max="1" step="0.1" value="0.5" data-css="0.5">
                </div>
            </div>
        </div>
    </div>



<script src="https://masumbillah6778.github.io/js/advance-music-playlist.js"></script>
<script src="https://masumbillah6778.github.io/js/music-album6.js"></script>
</body>

</html>
