<div class="tableContainer" style="margin:1.5rem 0">
  <h2 class="Title">TABLE SUM COLUMS AND ROWS (ADD & REMOVE ROWS)</h2>
  <table id="nameTable">
    <thead>
      <tr>
        <th style="text-align: center">#</th>
        <th style="text-align: center">Col1</th>
        <th style="text-align: center">Col2</th>
        <th style="text-align: center">Col3</th>
        <th style="text-align: center">Col4</th>
        <th style="text-align: center">Col5</th>
        <th style="text-align: center">Col6</th>
        <th style="text-align: center">Col7</th>
        <th class="total" style="text-align: center">TOTAL</th>
        <th style="text-align: center; width: 42px;" class="sorting_disabled" rowspan="1"
            colspan="1" aria-label="Add row">

          <button type="button" onclick="addRowTable(event, 'nameTable')" class="btn btn-success btn-xs">
            +
          </button>
        </th>
      </tr>
    </thead>
    
    <tbody id="nameTableBody">

      <tr>
        <td style="text-align: center">1</td>
        <td>
          <input type="number" class="row1 col1" onkeyup="sumColAndRows(1, 1, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row1 col2" onkeyup="sumColAndRows(1, 2, 'nameTable')" placeholder="..." style="width:56px"> 
        </td>
        <td>
          <input type="number" class="row1 col3" onkeyup="sumColAndRows(1, 3, 'nameTable')" placeholder="..." style="width:56px">
        </td>   
        <td>
          <input type="number" class="row1 col4" onkeyup="sumColAndRows(1, 4, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row1 col5" onkeyup="sumColAndRows(1, 5, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row1 col6" onkeyup="sumColAndRows(1, 6, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row1 col7" onkeyup="sumColAndRows(1, 7, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td style="text-align: center">
          <span class="slipTitle col8" id="rowTotal1">0</span>$
        </td>
        <td></td>
      </tr>
      
      <tr>
        <td style="text-align: center">2</td>
        <td>
          <input type="number" class="row2 col1"  onkeyup="sumColAndRows(2, 1, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row2 col2"  onkeyup="sumColAndRows(2, 2, 'nameTable')" placeholder="..." style="width:56px"> 
        </td>
        <td>
          <input type="number" class="row2 col3"  onkeyup="sumColAndRows(2, 3, 'nameTable')" placeholder="..." style="width:56px">
        </td>   
        <td>
          <input type="number" class="row2 col4"  onkeyup="sumColAndRows(2, 4, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row2 col5"  onkeyup="sumColAndRows(2, 5, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row2 col6"  onkeyup="sumColAndRows(2, 6, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td>
          <input type="number" class="row2 col7"  onkeyup="sumColAndRows(2, 7, 'nameTable')" placeholder="..." style="width:56px">
        </td>
        <td style="text-align: center">
          <span class="slipTitle col8" id="rowTotal2">0</span>$
        </td>
        <td></td>
      </tr>

    </tbody>

    <tfoot>

      <tr>
        <td style="text-align: center">
          <h5 class="slipTitle">Total</h5>
        </td>
        <td style="text-align: center">
           <span id="colTotal1" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal2" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal3" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal4" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal5" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal6" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="colTotal7" class="slipTitle">0</span>$
        </td>
        <td style="text-align: center">
          <span id="totalTotal" class="slipTitle">0</span>$
        </td>
      </tr>

    </tfoot>

  </table>
</div>
